services:
  postgres:
    image: postgres:16-alpine
    container_name: eticaret-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: payload
      POSTGRES_PASSWORD: payload_dev_pass
      POSTGRES_DB: eticaret_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: